plugins {
    id 'scala'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.80'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

compileJava {
    options.encoding = 'UTF-8'
}

compileScala {
    targetCompatibility = JavaVersion.VERSION_17
    sourceCompatibility = JavaVersion.VERSION_17
}

file "build.properties" withReader {
    def prop = new Properties()
    prop.load(it)
    ext.config = new ConfigSlurper().parse prop
}

version = "${config.mod.version}"
group = config.mod.group
base.archivesName = config.mod.name

repositories {
    mavenCentral()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name "MightyPirates"
        url "https://maven.cil.li/"
    }
    // REI repository
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
    }
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev/'
    }
}

dependencies {
    implementation "net.neoforged:forge:${config.neoforge.version}"
    
    implementation files('libs/OC-LuaJ-20220907.1.jar')
    implementation files('libs/OC-JNLua-20230530.0.jar')
    implementation files('libs/OC-JNLua-Natives-20220928.1.jar')
    
    // JOML for vector math (replaces LWJGL vectors)
    implementation 'org.joml:joml:1.10.5'
    
    // Typesafe Config for configuration management
    implementation 'com.typesafe:config:1.4.2'
    
    // Scala library for Scala compilation
    implementation 'org.scala-lang:scala-library:2.13.12'
    
    // REI integration will be added later when we find compatible versions
    // implementation "me.shedaniel:RoughlyEnoughItems-neoforge:12.0.684"
    // implementation "me.shedaniel.cloth:cloth-config-neoforge:11.1.118"
}

runs {
    configureEach {
        workingDirectory project.file('run')
        
        systemProperty 'neoforge.logging.markers', 'REGISTRIES'
        systemProperty 'neoforge.logging.console.level', 'debug'
        
        modSource project.sourceSets.main
    }
    
    client {
        // Client-specific configuration
    }
    
    server {
        // Server-specific configuration
    }
}

// Custom task to run client with only Java compilation (skip Scala)
task runClientJava {
    group = 'neoforge runs'
    description = 'Run Minecraft client with only Java code compiled (skip Scala)'
    
    doLast {
        println '='.repeat(60)
        println 'To run client with Java-only compilation, use:'
        println './gradlew runClient -x compileScala'
        println '='.repeat(60)
        println 'Note: This will skip Scala compilation and run with Java code only.'
        println 'Scala features will not be available until Scala compilation is fixed.'
    }
}

// Mappings are configured automatically in newer NeoForge versions

jar {
    manifest {
        attributes([
            "Specification-Title": "OpenComputers",
            "Specification-Vendor": "MightyPirates",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": project.version,
            "Implementation-Vendor": "MightyPirates"
        ])
    }
}

processResources {
    inputs.property "version", "${config.mod.version}"
    inputs.property "mcversion", config.minecraft.version
    inputs.property "neoforge_version", config.neoforge.version
    
    filesMatching(['META-INF/mods.toml']) {
        expand 'version': "${config.mod.version}", 
               'mcversion': config.minecraft.version, 
               'neoforge_version': config.neoforge.version
    }
}