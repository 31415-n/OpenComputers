plugins {
    id 'scala'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.80'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

compileJava {
    options.encoding = 'UTF-8'
}

compileScala {
    targetCompatibility = JavaVersion.VERSION_17
    sourceCompatibility = JavaVersion.VERSION_17
}

file "build.properties" withReader {
    def prop = new Properties()
    prop.load(it)
    ext.config = new ConfigSlurper().parse prop
}

version = "${config.mod.version}"
group = config.mod.group
base.archivesName = config.mod.name

repositories {
    mavenCentral()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name "MightyPirates"
        url "https://maven.cil.li/"
    }
}

dependencies {
    implementation "net.neoforged:forge:${config.neoforge.version}"
    
    implementation files('libs/OC-LuaJ-20220907.1.jar')
    implementation files('libs/OC-JNLua-20230530.0.jar')
    implementation files('libs/OC-JNLua-Natives-20220928.1.jar')
}

runs {
    configureEach {
        workingDirectory project.file('run')
        
        systemProperty 'neoforge.logging.markers', 'REGISTRIES'
        systemProperty 'neoforge.logging.console.level', 'debug'
        
        modSource project.sourceSets.main
    }
    
    client {
        // Client-specific configuration
    }
    
    server {
        // Server-specific configuration
    }
}

// Mappings are configured automatically in newer NeoForge versions

jar {
    manifest {
        attributes([
            "Specification-Title": "OpenComputers",
            "Specification-Vendor": "MightyPirates",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": project.version,
            "Implementation-Vendor": "MightyPirates"
        ])
    }
}

processResources {
    inputs.property "version", "${config.mod.version}"
    inputs.property "mcversion", config.minecraft.version
    inputs.property "neoforge_version", config.neoforge.version
    
    filesMatching(['META-INF/mods.toml']) {
        expand 'version': "${config.mod.version}", 
               'mcversion': config.minecraft.version, 
               'neoforge_version': config.neoforge.version
    }
}